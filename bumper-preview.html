<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
      hanging-punctuation: first last allow-end;
    background: #e3e0d4;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .bumper-wrap {
    width: 90vw;
    max-width: 900px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  /* All drawn paths: start as stroke-only, no fill */
  .draw-path {
    fill: none;
    stroke: #e07329;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
  }
  /* Fill layer: starts invisible, fades in */
  .fill-path {
    fill: #e07329;
    opacity: 0;
  }
  /* Animations applied via JS after measuring path lengths */
  .draw-path.animate {
    animation: drawIn var(--dur) var(--delay) cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
  }
  .fill-path.animate {
    animation: fillIn 0.6s var(--fill-delay) ease forwards;
  }
  @keyframes drawIn {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fillIn {
    to { opacity: 1; }
  }
  /* Stroke fades out as fill comes in */
  .draw-path.fade-stroke {
    animation: drawIn var(--dur) var(--delay) cubic-bezier(0.4, 0.0, 0.2, 1) forwards,
               fadeStroke 0.5s var(--fill-delay) ease forwards;
  }
  @keyframes fadeStroke {
    to { stroke-opacity: 0; }
  }
</style>

<script>
  // Timing config
  const LETTER_COUNT = 9; // 0-8
  const DRAW_DURATION_BASE = 0.8;  // seconds per letter
  const STAGGER = 0.15;             // overlap between letters
  const FILL_FADE = 0.5;            // seconds after last draw finishes

  // Measure all path lengths and set CSS custom properties
  const drawPaths = document.querySelectorAll('.draw-path');
  const fillPaths = document.querySelectorAll('.fill-path');

  // Calculate total animation duration
  const totalDrawTime = DRAW_DURATION_BASE + (LETTER_COUNT - 1) * STAGGER + DRAW_DURATION_BASE;

  drawPaths.forEach(path => {
    const len = path.getTotalLength();
    const letterIdx = parseInt(path.dataset.letter);
    const delay = letterIdx * STAGGER;
    // Longer paths get slightly more time
    const dur = DRAW_DURATION_BASE + (len / 3000) * 0.4;

    path.style.setProperty('--len', len);
    path.style.setProperty('--dur', dur + 's');
    path.style.setProperty('--delay', delay + 's');
    path.style.setProperty('--fill-delay', (delay + dur + FILL_FADE) + 's');
  });

  fillPaths.forEach(path => {
    const letterIdx = parseInt(path.dataset.letter);
    const correspondingDraw = document.querySelector(`.draw-path[data-letter="${letterIdx}"]`);
    const len = correspondingDraw.getTotalLength();
    const delay = letterIdx * STAGGER;
    const dur = DRAW_DURATION_BASE + (len / 3000) * 0.4;

    path.style.setProperty('--fill-delay', (delay + dur * 0.7) + 's');
  });

  // Trigger animations after a brief pause
  setTimeout(() => {
    drawPaths.forEach(p => p.classList.add('animate', 'fade-stroke'));
    fillPaths.forEach(p => p.classList.add('animate'));
  }, 400);
</script>
